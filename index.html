<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OSA – Open Student Agenda</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OSA"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--bg:#eef5fe;--surf:#fff;--surf2:#dbe9fb;--fg:#0f2440;--mut:#5a7596;--line:#cfe0f5;--acc:#1d6fe0;--acc-fg:#fff;--acc-soft:#cbe0fb;--knopf:#dae8fb;--knopf-h:#c6dcf7;--heute:#e6f0fd;--ok:#2e9d5b;--warn:#d98a14;--bad:#d64545;--now:#f26b3a;--chip-fg:#1f2937;--sh:none;--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111f;--surf:#1c1a2e;--surf2:#24213a;--fg:#ece9ff;--mut:#a29fc4;--line:#322e4f;--acc:#8b6cff;--acc-fg:#fff;--acc-soft:#363064;--knopf:#2b2745;--knopf-h:#383260;--heute:#221f3a;--now:#ff6b8b;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13111f;--surf:#1c1a2e;--surf2:#24213a;--fg:#ece9ff;--mut:#a29fc4;--line:#322e4f;--acc:#8b6cff;--acc-fg:#fff;--acc-soft:#363064;--knopf:#2b2745;--knopf-h:#383260;--heute:#221f3a;--now:#ff6b8b;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;margin:0}
h1,h2,h3,.brand{font-family:inherit;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surf);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:30}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--acc);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:5px;top:6px;width:12px;height:3px;background:var(--acc-fg);border-radius:2px;box-shadow:0 5px 0 var(--acc-fg)}
.sp{flex:1}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:7px 13px;border-radius:999px;color:var(--mut);cursor:pointer;white-space:nowrap;font-weight:500}
.nav button:hover{background:var(--surf2);color:var(--fg)}
.nav button.on{background:var(--acc-soft);color:var(--acc)}
.wk-col.heute,.mo .tag.heute{background:var(--heute)}
.btn{border:1px solid transparent;background:var(--knopf);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--knopf-h)}
.btn.pri{background:var(--acc);color:var(--acc-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:default}
main{padding-block:18px 60px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card+.card{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.mut{color:var(--mut)}
.small{font-size:12.5px}
h2{font-size:22px;letter-spacing:-.01em}
h3{font-size:15px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--surf2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 13px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:500}
.seg button.on{background:var(--surf);color:var(--fg);box-shadow:var(--sh)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);font-weight:500}
label.f>input,label.f>select,label.f>textarea{color:var(--fg);font-weight:400;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
/* Woche */
.wk{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);overflow:hidden;box-shadow:var(--sh)}
.wk-scroll{overflow-x:auto}
.wk-in{min-width:640px}
.wk-head,.wk-allday,.wk-body{display:grid;grid-template-columns:46px repeat(7,1fr)}
.wk-head>div{padding:8px 6px;text-align:center;border-left:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.wk-head>div:hover{background:var(--surf2)}
.wk-head .dn{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.wk-head .dd{font-size:19px;font-weight:600}
.wk-head .heute .dd{background:var(--acc);color:var(--acc-fg);border-radius:999px;display:inline-block;min-width:32px;padding:0 6px}
.wk-head .fer{font-size:10.5px;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-allday>div{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-height:26px}
.wk-allday>div:first-child{border-left:0;font-size:10px;color:var(--mut);padding:6px 4px}
.wk-body{position:relative}
.wk-hours{position:relative}
.wk-hours span{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;color:var(--mut)}
.wk-col{position:relative;border-left:1px solid var(--line);cursor:cell}
.wk-col.fer{background:color-mix(in srgb,var(--ok) 7%,transparent)}
.wk-col .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.ev{position:absolute;border-radius:7px;padding:2px 5px;font-size:12px;line-height:1.25;color:var(--chip-fg);overflow:hidden;cursor:pointer;border-left:3px solid rgba(0,0,0,.28);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ev b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.erl{opacity:.55;text-decoration:line-through}
.ev.fort{border-top-left-radius:0;border-top-right-radius:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.ev:hover{filter:brightness(.96);z-index:3}
.wk-fenster .wk-scroll{overflow:auto;overscroll-behavior:contain}
.wk-fenster .wk-top{position:sticky;top:0;z-index:8;background:var(--surf)}
.wk-mehr{position:absolute;left:3px;right:3px;z-index:7;font-size:11px;font-weight:600;line-height:1.3;padding:3px 6px;border-radius:999px;background:var(--acc);color:var(--acc-fg);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.wk-mehr[hidden]{display:none}
.wk-mehr:hover{filter:brightness(1.1)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--now)}
.chip{display:flex;align-items:center;gap:5px;border-radius:6px;padding:2px 6px;font-size:12px;color:var(--chip-fg);cursor:pointer;border-left:3px solid rgba(0,0,0,.28);min-width:0}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.erl span{text-decoration:line-through;opacity:.6}
.chip input{margin:0;accent-color:#333;flex:none}
.chip.fer{background:color-mix(in srgb,var(--ok) 22%,var(--surf));color:var(--fg);border-left-color:var(--ok)}
/* Monat */
.mo{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surf);box-shadow:var(--sh)}
.mo .dh{padding:7px;text-align:center;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);background:var(--surf2)}
.mo .tag{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.mo .tag.so{border-right:0}
.mo .kw{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;text-align:center;font-size:10.5px;font-weight:600;color:var(--mut);background:var(--surf2);cursor:pointer}
.mo .dh.kw{padding:7px 0;cursor:default;font-weight:400}
.mo .kw:not(.dh):hover{color:var(--acc)}
.wk-head .wk-kw .dd{font-size:13px;color:var(--mut)}
.wk-head .wk-kw .dn{font-size:10px}
.mo .tag:hover{background:var(--surf2)}
.mo .tag.aus{opacity:.45}
.mo .tag.fer{background:color-mix(in srgb,var(--ok) 8%,transparent)}
.mo .tag .n{font-size:12px;font-weight:600;color:var(--mut)}
.mo .tag.heute .n{background:var(--acc);color:var(--acc-fg);border-radius:999px;padding:0 7px;align-self:flex-start}
.mo .mehr{font-size:11px;color:var(--mut);padding-left:4px}
/* Jahr */
.jahr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mini{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
.mini h3{cursor:pointer}
.mini h3:hover{color:var(--acc)}
.mini .g{display:grid;grid-template-columns:22px repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.mini .g .kw{grid-column:1;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:9.5px;cursor:pointer;border-right:1px solid var(--line)}
.mini .g b.kw{cursor:default;font-weight:500}
.mini .g span.kw:hover{color:var(--acc)}
.mini .g b{color:var(--mut);font-weight:500;font-size:10px}
.mini .g i{font-style:normal;padding:3px 0;border-radius:6px;cursor:pointer}
.mini .g i:hover{outline:1px solid var(--acc)}
.mini .g i.h{outline:2px solid var(--acc)}
.mini .g i.l1{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.mini .g i.l2{background:color-mix(in srgb,var(--acc) 38%,transparent)}
.mini .g i.l3{background:color-mix(in srgb,var(--acc) 62%,transparent);color:var(--acc-fg)}
.mini .g i.f{box-shadow:inset 0 -3px 0 var(--ok)}
/* Listen, Tabellen */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .tx b{font-weight:600}
.li .tx div{overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surf2);color:var(--mut);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.prog{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.prog>i.ok{background:var(--ok)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font-weight:600;font-size:26px;letter-spacing:-.02em}
.kpi span{color:var(--mut);font-size:12.5px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .s{width:min(100%,56px);display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bars .s i{display:block;width:100%;border-radius:5px 5px 0 0;min-height:0}
.bars em{font-style:normal;font-size:11px;color:var(--mut);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0}
.hbar .prog{height:12px}
/* Dialog, Toast */
.ov{position:fixed;inset:0;background:rgba(10,12,24,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}
.dlg{background:var(--surf);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(620px,100%);margin-block:auto;padding:20px;border:1px solid var(--line)}
.dlg h2{margin-bottom:14px;font-size:19px}
.dlg .body{display:flex;flex-direction:column;gap:12px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toasts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 24px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center}
.toast button{background:none;border:0;color:inherit;cursor:pointer;opacity:.7;font-size:16px}
.warnbox{background:color-mix(in srgb,var(--warn) 15%,var(--surf));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:10px;padding:10px 12px;white-space:pre-line;font-size:13px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button.on{border-color:var(--fg)}
.tog{display:flex;gap:8px;flex-wrap:wrap}
.tog button{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tog button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.tog button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.tog button.on::before{background:var(--acc)}
.sec{margin-top:22px}
.sec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:10px}
.empty{padding:26px;text-align:center;color:var(--mut)}
.pop{position:absolute;z-index:40;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;width:min(360px,calc(100vw - 32px))}
@media (max-width:640px){.bar{flex-wrap:wrap}.brand{font-size:16px}.mo{grid-template-columns:20px repeat(7,minmax(0,1fr))}.mo .kw{font-size:9px}.mo .tag{min-height:70px}.mo .chip{font-size:10.5px;padding:1px 3px}.hbar{grid-template-columns:90px 1fr auto}}

.side{display:flex;gap:22px;align-items:flex-start;padding-top:18px}
.sidenav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:3px;width:190px;flex:none}
.sidenav button{border:0;background:none;text-align:left;padding:9px 16px;border-radius:999px;color:var(--mut);cursor:pointer;font-weight:500}
.sidenav button:hover{background:var(--surf2);color:var(--fg)}
.sidenav button.on{background:var(--acc-soft);color:var(--acc)}
.mainc{flex:1;min-width:0;padding-block:0 60px}
@media (max-width:760px){.side{flex-direction:column;gap:8px;align-items:stretch}.sidenav{position:static;flex-direction:row;width:100%;overflow-x:auto;scrollbar-width:none}.sidenav button{white-space:nowrap}}

button,.btn,.nav button,.sidenav button,.seg button,.chip,.ev,.mo .tag,.mini .g i{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){
 .btn{min-height:42px;padding:9px 15px}.btn.sm{min-height:36px;padding:6px 12px}
 .nav button,.sidenav button{padding:11px 16px}
 .seg button{padding:8px 15px}
 input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{font-size:16px;padding:10px 11px}
 input[type=checkbox]{width:22px;height:22px}
 .chip{padding:5px 8px;font-size:13px}
 .chip input{width:20px;height:20px}
 .li{padding:12px 4px}
 .mini .g i{padding:7px 0}
 .sw button{width:34px;height:34px}
 .tog button{padding:9px 15px}
}
@media (max-width:640px){
 .ov{align-items:flex-end;padding:0}
 .dlg{width:100%!important;margin:0;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
 .dlg .foot .btn{flex:1 1 auto;justify-content:center}
 h2{font-size:19px}
 .wk-in{min-width:560px}
}


/* ===== OSA-Design: so sieht auch das Python-Programm aus ===== */
body{font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,.brand{font-family:inherit}
.top{background:var(--bg);border-bottom:0}
body::before{background:var(--bg)}
.brand{display:none}
.bar{padding-block:12px 6px;justify-content:flex-end}
.nav{gap:6px;padding-bottom:12px}
.nav button,.sidenav button{padding:10px 20px;font-weight:600;color:var(--mut)}
.nav button:hover,.sidenav button:hover{background:color-mix(in srgb,var(--bg),var(--acc) 8%);color:var(--acc)}
.nav button.on,.sidenav button.on{background:color-mix(in srgb,var(--bg),var(--acc) 17%);color:var(--acc)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.sub button{border:0;background:none;padding:8px 18px;border-radius:999px;color:var(--mut);cursor:pointer;font-weight:600}
.sub button:hover{background:color-mix(in srgb,var(--bg),var(--acc) 8%);color:var(--acc)}
.sub button.on{background:color-mix(in srgb,var(--bg),var(--acc) 17%);color:var(--acc)}
.seg{background:none;padding:0;gap:6px}
.seg button{padding:8px 18px;border-radius:999px;font-weight:600}
.seg button.on{background:color-mix(in srgb,var(--bg),var(--acc) 17%);color:var(--acc);box-shadow:none}
.btn{border-radius:999px;padding:9px 20px;min-height:38px;font-weight:600;justify-content:center}
.btn.sm{padding:5px 14px;min-height:30px;font-size:13px}
.btn.ghost{background:var(--knopf)}
.btn.ghost:hover{background:var(--knopf-h)}
.btn.pri:hover{filter:none;background:color-mix(in srgb,var(--acc),#000 14%)}
main{padding-block:6px 60px}
.card{border-radius:20px;box-shadow:none;padding:18px}
.wk,.mo,.mini,.kpi{border-radius:18px;box-shadow:none}
.dlg{border-radius:22px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{border-radius:10px;padding:8px 11px}
h2{font-size:20px}
h2.kz{display:none}
th{background:var(--surf2);text-transform:none;letter-spacing:0;font-size:12.5px}
.tbl{overflow:hidden;border-radius:18px}
.wk-head>div{background:var(--surf2)}
.wk-head>div.heute{background:var(--acc);color:var(--acc-fg)}
.wk-head .heute .dn{color:var(--acc-fg)}
.wk-head .heute .dd{background:none;padding:0;color:inherit}
.wk-head .dd,.kpi b{font-family:inherit}
.kpi b{font-weight:700}
.ev{border-radius:10px;border-left:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.chip{border-radius:8px;border-left:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.gross{font-size:30px;font-weight:700;letter-spacing:-.01em}
.gross.neg{color:var(--bad)}

@keyframes ovein{from{opacity:0}to{opacity:1}}

@keyframes dlgup{from{transform:translateY(100%)}to{transform:none}}

.ov{animation:ovein .18s ease both}
.dlg{animation:dlgin .24s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:640px){.dlg{animation-name:dlgup;animation-duration:.28s}}
.toast{animation:toastin .26s cubic-bezier(.2,.8,.2,1) both}
.li:hover{background:color-mix(in srgb,var(--surf),var(--acc) 5%)}

s a la lista de la compra. Costes con * : falta el precio de algunos ingredientes.", "Eigene Farben für das oben gewählte Farbschema. Klick auf das Farbfeld öffnet die Farbauswahl, oder trage einen Code wie #4f6bed ein.\nWirksam mit Speichern.": "Tus propios colores para el esquema elegido arriba. Haz clic en el cuadro de color para abrir el selector, o escribe un código como #4f6bed.\nSe aplica al guardar.", "Was hast du zu Hause? Eine Zutat pro Zeile mit Menge und Einheit.\nOhne Menge (z. B. Salz) gilt die Zutat als immer vorrätig.\nDer Vorrat wird in der Einkaufsliste abgezogen.": "¿Qué tienes en casa? Un ingrediente por fila con cantidad y unidad.\nSin cantidad (p. ej. sal) el ingrediente cuenta como siempre disponible.\nLas existencias se restan en la lista de la compra.", "Ein Preis pro Zeile, damit die Kosten berechnet werden.\nBeispiel: Nudeln | 1,89 € | pro (leer = 1) | kg.\nOhne Einheit gilt der Preis je Einkauf (z. B. Salz).\nMit 🔍 suchst du den Preis im Internet (Open Prices).": "Un precio por fila para calcular los costes.\nEjemplo: Pasta | 1,89 € | por (vacío = 1) | kg.\nSin unidad, el precio es por compra (p. ej. sal).\nCon 🔍 buscas el precio en internet (Open Prices).", "So geht's: Wähle den Zeitraum. Die Liste wird aus den Mahlzeiten im Essensplan und deren Rezepten erstellt; was du schon zu Hause hast (Seite Vorräte), wird abgezogen. Doppelklick auf eine Zeile hakt sie ab.": "Así funciona: elige el periodo. La lista se crea con las comidas del plan y sus recetas; lo que ya tienes en casa (página Existencias) se resta. Doble clic en una fila la marca.", "Diese Ausgabe wird automatisch aus dem Essensplan und der Preisliste geschätzt.\nÄndere das Gericht, das Rezept oder die Preise - oder schalte die Einrechnung oben aus.": "Este gasto se estima automáticamente a partir del plan de comidas y la lista de precios.\nCambia el plato, la receta o los precios, o desactiva el cálculo arriba.", "Dieser Termin überschneidet sich": "Esta cita se solapa", "auch n budget mensuel défini.", "Kein freies Zeitfenster in diesem Zeitraum. Verlängere den Zeitraum oder kürze die Dauer.": "Aucun créneau libre sur cette période. Allonge la période ou raccourcis la durée.", "Keine Einträge an diesem Tag.": "Aucune entrée ce jour-là.", "Keine Mahlzeiten im Zeitraum": "Aucun repas sur cette période", "Klick auf einen Tag: Einträge ansehen, bearbeiten oder löschen": "Clique sur un jour : voir, modifier ou supprimer les entrées", "Klicke auf den Reiter \"+\" und wähle Termin, Aufgabe oder Essen.": "Clique sur l'onglet « + » et choisis rendez-vous, tâche ou repas.", "Kommende Fristen (gelb = innerhalb des Vorlaufs)": "Échéances à venir (jaune = dans le préavis)", "Liegen Einträge außerhalb, erweitert sich der Bereich automatisch.": "Si des entrées sont en dehors, la plage s'étend automatiquement.", "Länge eines Mahlzeit-Blocks in der Wochenansicht (Minuten):": "Durée d'un bloc repas dans la vue hebdomadaire (minutes) :", "Mindestens eine Kategorie muss bleiben.": "Au moins une catégorie doit rester.", "Monatsbudget für Ausgaben (€):": "Budget mensuel des dépenses (€) :", "Nur Aufgaben lassen sich abhaken.": "Seules les tâches peuvent être cochées.", "Ohne Datum gilt der Eintrag für den gewählten Wochentag der aktuellen Woche.": "Sans date, l'entrée s'applique au jour choisi de la semaine en cours.", "Standard-Dauer einer Lehrveranstaltung (Minuten):": "Durée par défaut d'un cours (minutes) :", "Standard-Dauer eines neuen Termins (Minuten):": "Durée par défaut d'un nouveau rendez-vous (minutes) :", "Standard-Uhrzeit beim Eintragen (leer = keine Uhrzeit):": "Heure par défaut à l'ajout (vide = pas d'heure) :", "So groß ist auch das Feld, das beim Darüberfahren in der Woche erscheint.": "C'est aussi la taille du champ qui apparaît au survol dans la vue hebdomadaire.", "bis (Uhr):": "jusqu'à (h) :", "Uhrzeiten links mit der Maus ziehen = Abstand ändern (Doppelklick: automatisch)": "Fais glisser les heures à gauche avec la souris = changer l'écart (double-clic : automatique)", "Einzelne Termine änderst oder löschst du über Klick auf den Tag.": "Tu modifies ou supprimes des rendez-vous isolés en cliquant sur le jour.", "Uhrzeit: bitte HH:MM eingeben (z. B. 08:30) oder leer lassen.": "Heure : saisis HH:MM (p. ex. 08:30) ou laisse vide.", "Uhrzeit: bitte HH:MM eingeben (z. B. 10:15).": "Heure : saisis HH:MM (p. ex. 10:15).", "Uhrzeit: bitte HH:MM eingeben (z. B. 12:30) oder leer lassen.": "Heure : saisis HH:MM (p. ex. 12:30) ou laisse vide.", "Wird mit Speichern sofort übernommen.": "Pris en compte dès l'enregistrement.", "Wochenansicht: 'von' muss kleiner als 'bis' sein (0 bis 24 Uhr).": "Vue hebdomadaire : « de » doit être inférieur à « à » (0 à 24).", "Wochenziel: bitte Stunden von 0 bis 100 eingeben.": "Objectif hebdomadaire : saisis des heures de 0 à 100.", "Wiederkehrende Aufgaben hakst du pro Tag im Kalender ab: Klick auf den Tag, dann Abhaken.": "Tu coches les tâches récurrentes jour par jour dans le calendrier : clique sur le jour, puis Cocher.", "Zutaten für einmal Kochen (Menge und Einheit sind optional, z. B. bei Salz):": "Ingrédients pour une fois (quantité et unité facultatives, p. ex. pour le sel) :", "Trage im Essensplan Mahlzeiten ein (Reiter Essensplan), dann erscheint hier die Einkaufsliste.": "Saisis des repas dans le plan alimentaire (onglet Plan alimentaire), la liste de courses apparaît alors ici.", "Was du zu Hause hast. Diese Mengen werden von der Einkaufsliste abgezogen. Zutaten ohne Menge (z. B. Salz) gelten als immer vorrätig.": "Ce que tu as à la maison. Ces quantités sont déduites de la liste de courses. Les ingrédients sans quantité (p. ex. le sel) comptent comme toujours en stock.", "Eigene Kategorien für Termine und Aufgaben, jede mit einer Standardfarbe. Wirksam mit Speichern.": "Tes propres catégories pour rendez-vous et tâches, chacune avec une couleur par défaut. Prises en compte à l'enregistrement.", "Einstellungen bleibt immer sichtbar. Ausgeblendete Reiter behalten ihre Daten.": "Paramètres reste toujours visible. Les onglets masqués conservent leurs données.", "Gezählt wird die Dauer erledigter Aufgaben mit diesem Fach (Feld \"Fach\" im Formular). Termine wie Vorlesungen zählen nicht als Lernzeit.": "On compte la durée des tâches terminées avec cette matière (champ « Matière » du formulaire). Les rendez-vous comme les cours ne comptent pas comme temps d'étude.", "Hier stehen deine Gerichte mit Zutaten. Trägst du im Essensplan ein Gericht mit Rezept ein, landen die Zutaten automatisch in der Einkaufsliste. Kosten mit * : bei einzelnen Zutaten fehlt noch ein Preis.": "Voici tes plats avec leurs ingrédients. Si tu ajoutes au plan un plat avec recette, les ingrédients vont automatiquement dans la liste de courses. Coûts avec * : il manque encore un prix pour certains ingrédients.", "Eigene Farben für das oben gewählte Farbschema. Klick auf das Farbfeld öffnet die Farbauswahl, oder trage einen Code wie #4f6bed ein.\nWirksam mit Speichern.": "Tes propres couleurs pour le thème choisi ci-dessus. Clique sur le champ de couleur pour ouvrir le sélecteur, ou saisis un code comme #4f6bed.\nPris en compte à l'enregistrement.", "Was hast du zu Hause? Eine Zutat pro Zeile mit Menge und Einheit.\nOhne Menge (z. B. Salz) gilt die Zutat als immer vorrätig.\nDer Vorrat wird in der Einkaufsliste abgezogen.": "Qu'as-tu à la maison ? Un ingrédient par ligne avec quantité et unité.\nSans quantité (p. ex. le sel), l'ingrédient compte comme toujours en stock.\nLe stock est déduit dans la liste de courses.", "Ein Preis pro Zeile, damit die Kosten berechnet werden.\nBeispiel: Nudeln | 1,89 € | pro (leer = 1) | kg.\nOhne Einheit gilt der Preis je Einkauf (z. B. Salz).\nMit 🔍 suchst du den Preis im Internet (Open Prices).": "Un prix par ligne pour calculer les coûts.\nExemple : Pâtes | 1,89 € | par (vide = 1) | kg.\nSans unité, le prix vaut par achat (p. ex. le sel).\nAvec 🔍 tu cherches le prix sur Internet (Open Prices).", "So geht's: Wähle den Zeitraum. Die Liste wird aus den Mahlzeiten im Essensplan und deren Rezepten erstellt; was du schon zu Hause hast (Seite Vorräte), wird abgezogen. Doppelklick auf eine Zeile hakt sie ab.": "Voici comment faire : choisis la période. La liste est créée à partir des repas du plan et de leurs recettes ; ce que tu as déjà à la maison (page Réserves) est déduit. Un double-clic sur une ligne la coche.", "Diese Ausgabe wird automatisch aus dem Essensplan und der Preisliste geschätzt.\nÄndere das Gericht, das Rezept oder die Preise - oder schalte die Einrechnung oben aus.": "Cette dépense est estimée automatiquement d'après le plan alimentaire et la liste de prix.\nModifie le plat, la recette ou les prix – ou désactive le calcul ci-dessus.", "Dieser Termin überschneidet sich": "Ce rendez-vous chevauche", "auch für Mahlzeiten mit Uhrzeit": "aussi pour les repas avec heure", "Beschriftung der farbigen Knöpfe": "Texte des boutons colorés", "Fensterhintergrund": "Arrière-plan de la fenêtre", "Flächen": "Surfaces", "Hintergrund der heutigen Spalte/Zelle": "Arrière-plan de la colonne/cellule d'aujourd'hui", "Hinweise, Überschriften, inaktive Reiter": "Remarques, titres, onglets inactifs", "Linie der aktuellen Uhrzeit in der Woche": "Ligne de l'heure actuelle dans la semaine", "Markierte Zeile in Tabellen und Listen": "Ligne sélectionnée dans les tableaux et listes", "Markierung": "Sélection", "Normale Schrift": "Texte normal", "Schrift auf der Hauptfarbe": "Texte sur la couleur principale", "Schriftfarbe": "Couleur du texte", "Tabellen, Kalenderzellen, aktiver Reiter": "Tableaux, cellules du calendrier, onglet actif", "Wichtige Knöpfe, Schrift des aktiven Reiters, Rahmen beim Tippen, heutiger Tag": "Boutons importants, texte de l'onglet actif, cadre à la saisie, aujourd'hui", "Zweite Schriftfarbe": "Couleur de texte secondaire", "Preise für ": "Prix pour ", "Uhrzeit für ": "Heure pour ", "Dunkel": "Sombre", "Kein Ziel gesetzt": "Aucun objectif défini", "kein Ziel gesetzt": "aucun objectif déf <script>
/* ============================================================
   Alltagsplaner – Rechenkern (Daten, Wiederholungen, Auswertungen)
   Portiert aus alltag.py; das Datenformat ist dasselbe (osa.json).
   ============================================================ */
"use strict";

/* ---------- Datum und Uhrzeit ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const _isoCache = new Map();
const parseISO = s => {
  let ts = _isoCache.get(s);
  if (ts === undefined) { const [y, m, d] = s.split("-").map(Number); ts = new Date(y, m - 1, d, 12).getTime(); if (_isoCache.size > 5000) _isoCache.clear(); _isoCache.set(s, ts); }
  return new Date(ts);
};
const heute = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((a - b) / 864e5);
const wochentagNr = d => (d.getDay() + 6) % 7;            // Montag = 0
const montagVon = d => addDays(d, -wochentagNr(d));
function kwVon(d) {                          // Kalenderwoche nach ISO 8601 (Woche 1 enthält den 4. Januar)
  const don = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 3 - wochentagNr(d), 12);   // Donnerstag derselben Woche
  const j4 = new Date(don.getFullYear(), 0, 4, 12);
  return 1 + Math.round((diffDays(don, j4) - 3 + wochentagNr(j4)) / 7);
}
const tageImMonat = (j, m) => new Date(j, m, 0).getDate();   // m = 1..12
const deDatum = s => s ? (([y, m, d]) => `${d}.${m}.${y}`)(s.split("-")) : "";
const deKurz = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
function datumParsen(text) {                 // "TT.MM.JJJJ" -> "JJJJ-MM-TT"; "" -> ""; ungültig -> null
  text = (text || "").trim();
  if (!text) return "";
  const m = text.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1], 12);
  if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;

if (!speicher._ok) toast("Hinweis: Der Browser blockiert hier das Speichern – bitte Sicherungen anlegen.");
/* Wischen: links/rechts wechselt Woche, Monat, Jahr */
(function () {
  let sx = 0, sy = 0, st = 0, ziel = null;
  document.addEventListener("touchstart", e => { if (e.touches.length !== 1) { ziel = null; return; } const t0 = e.touches[0]; sx = t0.clientX; sy = t0.clientY; st = Date.now(); ziel = e.target; }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!ziel || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy, z = ziel; ziel = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - st > 700) return;
    if (document.querySelector(".ov") || z.closest("input,textarea,select,.pop")) return;
    const sc = z.closest(".wk-scroll");
    if (sc && !z.closest(".wk-head,.wk-allday") && sc.scrollWidth > sc.clientWidth + 2) {                         // erst am Rand der Tabelle wechseln
      if (dx < 0 && sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 2) return;
      if (dx > 0 && sc.scrollLeft > 2) return;
    }
    const r = dx < 0 ? 1 : -1;
    if (ui.tab === "kalender") schieben(r);
    else if (ui.tab === "stundenplan") { ui.spPlan = addDays(ui.spPlan, 7 * r); render(); }
    else if (ui.tab === "geld" && ui.geld === "uebersicht") { ui.budgetMonat = addMonate(ui.budgetMonat, r); render(); }
  }, { passive: true });
})();
window.addEventListener("storage", e => { if (e.key === SPEICHER) { laden(); render(); } });
/* Als Handy-App installierbar und offline nutzbar – nur wenn die Seite aus dem Internet (http/https) kommt, nicht als lokale Datei */
if (/^https?:$/.test(location.protocol)) {
  const mf = document.createElement("link"); mf.rel = "manifest"; mf.href = "manifest.webmanifest"; document.head.append(mf);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
}
/* Den Browser bitten, die Daten dauerhaft zu behalten (sonst darf er sie bei Speicherknappheit löschen) */
try {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persisted()
    .then(schon => schon ? true : navigator.storage.persist())
    .then(ok => { ui.dauerhaft = !!ok; if (ui.tab === "einstellungen") render(); }).catch(() => { });
} catch (e) { }

</script>
